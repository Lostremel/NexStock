<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>NextStock</title>

  <link rel="icon" type="image/png" href="favicon.png?v=10">
  <link rel="shortcut icon" type="image/png" href="favicon.png?v=10">
  <link rel="apple-touch-icon" href="favicon.png?v=10">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">

  <script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <div id="root"></div>

  <div id="toast-container"></div>

  <div class="modal fade" id="input-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header">
          <h5 class="modal-title" id="input-modal-title">Entrada de Dados</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body p-4">
          <p id="input-modal-label" class="mb-3 fw-medium"></p>

          <div class="input-group input-group-lg">
            <span class="input-group-text bg-light border-end-0" id="input-modal-prefix">R$</span>
            <input type="number" id="input-modal-field"
              class="form-control bg-light border-start-0"
              placeholder="0.00" step="0.01">
          </div>

          <div id="input-modal-error" class="text-danger small mt-2" style="display: none;">
            Valor inválido
          </div>
        </div>

        <div class="modal-footer border-0">
          <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">
            Cancelar
          </button>

          <button type="button" id="input-modal-confirm"
            class="btn btn-primary px-4"
            style="background-color: var(--rosa-medio); border-color: var(--rosa-medio); color: #000;">
            Confirmar
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="ver-produtos-fornecedor-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header">
          <h5 class="modal-title" id="ver-produtos-titulo">Detalhes</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="ver-produtos-corpo">
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/clientes.js"></script>
  <script src="js/pedidos.js"></script>
  <script src="js/produtos.js"></script>
  <script src="js/fornecedores.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/manutencao.js"></script>
  <script src="js/app.js"></script>
  
</body>
</html>
